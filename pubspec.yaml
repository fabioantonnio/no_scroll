name: no_scroll
description: "No Scroll - Um app de personalização completa"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.2.0

dependencies:
  flutter:
    sdk: flutter

  # Gerenciamento de estado
  flutter_riverpod: ^2.4.0

  # Banco de dados remoto (Supabase)
  supabase_flutter: ^2.0.0

  # Banco de dados local (SQLite + Drift)
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # Internacionalização
  flutter_localizations:
    sdk: flutter
  intl: any

  # Persistência de preferências
  shared_preferences: ^2.2.0

  # Utilitários
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.14.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  # Assets (serão adicionados depois)
  # assets:
  #   - assets/images/
  #   - assets/fonts/
  #   - assets/icons/

  # Internacionalização
  generate: true